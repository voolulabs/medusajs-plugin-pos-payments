# Compliance — coleta de evidência para o Probo (GRC self-hosted no WSL).
# ESCOPO DA ENGENHARIA: somente coleta/smoke via CLI prb. Políticas, controles
# e conteúdo do programa são do time de plataforma e controladoria.
#
# A instância Probo vive na tailnet (host/porta no secret PROBO_HOST):
# o runner entra no tailnet via Tailscale Action. Segredos necessários:
#   PROBO_TOKEN (token de automação gerado na instância)
#   TAILSCALE_OAUTH_CLIENT_ID / TAILSCALE_OAUTH_CLIENT_SECRET (client ACL-tagged)
name: Compliance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1" # segundas 08:00 UTC — evidência semanal

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    # Rollout: informativo até o primeiro verde com secrets preenchidos
    # (endurecer removendo o continue-on-error).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tailscale (runner entra na tailnet para alcançar a instância)
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          # exigido pelo action com OAuth: sem `tags` o check "Auth Info Empty"
          # falha ("OAuth identity empty") mesmo com os secrets preenchidos
          tags: tag:ci

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "stable"

      - name: prb (build do clone na tag do servidor)
        # Version skew: fixar o clone na MESMA tag do servidor (0.299.0 no WSL).
        run: |
          git clone --depth 1 --branch probod/v0.299.0 https://github.com/getprobo/probo.git /tmp/probo-src
          cd /tmp/probo-src && go build -o /usr/local/bin/prb ./cmd/prb

      - name: Diagnóstico de rede (falha rápido, sinal claro)
        env:
          PROBO_HOST: ${{ secrets.PROBO_HOST }}
        run: |
          IP="${PROBO_HOST#http://}"; IP="${IP%%:*}"
          tailscale status --peers | grep -v offline | head -8 || true
          tailscale ping --c 2 "$IP" || true
          curl -sS -o /dev/null -w "GET http://${PROBO_HOST#http://}/ -> %{http_code}\n" --max-time 15 "http://${PROBO_HOST#http://}/" || true

      - name: Smoke — conectividade e autenticação na instância
        env:
          PROBO_HOST: ${{ secrets.PROBO_HOST }}
          PROBO_TOKEN: ${{ secrets.PROBO_TOKEN }}
          PROBO_ORG: ${{ secrets.PROBO_ORG }}
        # auth via env (PROBO_HOST/PROBO_TOKEN) é o mecanismo não-interativo do
        # prb (config.go DefaultHost); o "not logged in" do auth status refere-se
        # só ao config file. framework list sem --json (não existe na 0.299.0) e
        # com --org: no caminho por env não há organização default.
        run: |
          prb auth status --no-interactive --no-color
          prb framework list --org "$PROBO_ORG" --limit 5 --no-interactive --no-color
