# CI do plugin — verificação completa do padrão de engenharia: lint, build, testes,
# typecheck, knip, higiene de código (opcore), segurança + gates do ciclo ADLC
# (spec-lint, gate-manifest verify).
# Pino de versões: oficial actions/* em major tag; adlc e opcore pinados por versão exata.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # semanal: drift de deps/vulns sem queimar quota diária

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # história completa (inspeção de repositório e diffs de gate)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.10.0 --activate
          pnpm --version

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      # Falha rápido e barato antes de build/testes: convenções Medusa
      # (@medusajs/eslint-plugin, preset recommended da comunidade) + estilo
      # Prettier do monorepo Medusa. O script `lint` já roda --max-warnings 0.
      - name: Lint (ESLint Medusa + Prettier)
        run: |
          pnpm lint
          pnpm format:check

      - name: Build (medusa plugin:build)
        working-directory: plugins/pos-payments
        run: pnpm exec medusa plugin:build

      - name: Unit tests (vitest) — thresholds de coverage são gate (90/95)
        working-directory: plugins/pos-payments
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        # Pin por SHA (padrão da casa); v7.1.1. `files` é relativo à RAIZ do
        # repo, não ao working-directory dos steps de teste. Sem o secret
        # CODECOV_TOKEN o upload falha sem pintar o CI — endurecer para true
        # depois do secret + primeiro upload (baseline).
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: plugins/pos-payments/coverage/lcov.info
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true # secret ativo + baseline existente (2026-09-30)

      - name: Typecheck (strict)
        working-directory: plugins/pos-payments
        run: pnpm exec tsc --noEmit

      - name: Knip — codigo morto (baseline limpa 2026-10-01, gate provado por mutation)
        run: pnpm knip

      # Higiene de código: sintaxe, complexidade, ciclos e duplicação.
      # Projeto DISTINTO do ciclo ADLC (vendor the-open-engine ≠ voodootikigod).
      - name: Opcore (fast verify completo)
        env:
          OPCORE_NO_HOOKS: "1"
        run: |
          npm i -g --foreground-scripts @the-open-engine-company/opcore@0.3.3
          opcore check --repo . --all

      # Ciclo ADLC: P1 (spec precisa de critérios de aceite com método de
      # verificação) + tamper-evidence do ledger append-only de evidência
      # (.adlc/manifest.jsonl). verify: exit 0 com ledger vazio/ausente;
      # exit 2 = cadeia quebrada (provado por mutation). --ignore-scripts:
      # pacote zero-dependência, higiene de supply-chain.
      - name: ADLC (spec gate + manifest verify)
        env:
          # HMAC do ledger: com a chave o verify atesta autoria das entradas;
          # sem ela prova apenas consistência interna da cadeia.
          ADLC_MANIFEST_KEY: ${{ secrets.ADLC_MANIFEST_KEY }}
        run: |
          npm i -g --ignore-scripts @adlc/cli@1.11.1
          adlc spec-lint .adlc/specs/fase-1-provider-manual.md
          adlc gate-manifest verify --json

      - name: npm audit (bloqueia high/critical em prod)
        run: pnpm audit --prod --audit-level high

      - name: FOSSA (licenças + segurança — CI/CD scan do lockfile pnpm)
        # Pin por SHA (padrão da casa); v2.0.0. CLI 3.20.0 (provado com o nosso
        # pnpm-lock no ensaio manual). Analyze+upload: é o scan que dá ao projeto
        # o grafo real de produção. `fossa test --diff` (só issues novas) volta
        # depois que o BASELINE existir no FOSSA — o diff exige a revisão base
        # já analisada (o 1º run do projeto não a tem).
        uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # v2.0.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          pinned-cli-version: 3.20.0

      # Cota de terceiro (free: 200 testes Open Source/mês + 100 Code/mês; doc
      # "what counts as a test": cada manifest no escopo = 1 teste — são 2/run
      # com a raiz do workspace). Fora dos PRs: o mesmo lockfile é escaneado no
      # push de develop/main e no cron semanal. Regra de ouro: serviço metered
      # não é gate em toda a superfície de trigger (decisão 2026-10-02).
      - name: Snyk (SAST + dependências)
        # Também em pull_request: valida o gate (e o Consistent Ignore) ANTES
        # da develop — foi o passo que derrubou a develop pós-T-CANCEL-CONTRACT.
        # PRs deste repo são same-repo, então SNYK_TOKEN está disponível.
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npm i -g snyk@latest
          snyk code test --severity-threshold=low
          snyk test --all-projects

      - name: Gitleaks (secret scanning — critério MUST da spec §6.6)
        # Binário pinado por checksum, não a action: a gitleaks-action v3 exige
        # licença (GITLEAKS_LICENSE) para orgs — o binário é o scanner OSS.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact -v

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Lint commits (conventional — ADR 0006 §2)
        run: |
          npx --yes -p @commitlint/cli@21 -p @commitlint/config-conventional@21 \
            commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
