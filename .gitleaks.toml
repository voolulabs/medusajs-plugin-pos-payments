# Estende as regras default com um allowlist estavel (por caminho, imune a
# rewrite de historico): o unico FP do repo e o namespace DNS PUBLICO do
# RFC 4122 que o commit de introducao carregou em stores/pos/route.ts —
# hoje o codigo usa a constante NAMESPACE_DNS (sem literal).
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
paths = [
  'plugins/pos-payments/src/api/admin/pos-payments/stores/pos/route[.]ts',
  # assinaturas HMAC do ledger ADLC sao provas, nao credenciais
  '[.]adlc/manifest[.]jsonl',
]
